# Default Configuration for Soccer GATv2 with D2 Group Equivariance
# Based on TacticAI (arXiv:2310.10553) & DeepMind CLRS GATv2FullD2

data:
  num_players: 22
  node_dim: 7       # synthetic tracking data: x, y, vx, vy, height, weight, ball_possession
                    # (StatsBomb 360 graphs always use their 5-channel layout: x, y, is_actor, is_teammate, is_keeper)
  edge_dim: 1       # opposing team indicator
  graph_dim: 7      # is_pass, is_shot, period, minute/90, under_pressure, pass_height, pass_body_part
  pitch_length: 120.0
  pitch_width: 80.0
  grid_m: 26        # pass target grid: bins along the pitch length
  grid_n: 17        # pass target grid: bins along the pitch width

model:
  hidden_dim: 64
  num_layers: 4     # T = 4 group convolution layers as in TacticAI
  nb_heads: 8       # 8 attention heads
  dropout: 0.0
  use_mlp: false    # Linear head by default (TacticAI paper consistency)
  symmetry: d2      # d2 | y_flip | none; train_temporal_receiver.py defaults to y_flip
  enable_receiver_head: true
  enable_target_location_head: true
  enable_shot_head: true
  enable_creativity_head: true
  enable_vae_head: true
  vae_latent_dim: 16

training:
  batch_size: 128   # 128 / 256 from TacticAI S.Table 1
  epochs: 50
  lr: 0.0001        # 1e-4 from TacticAI S.Table 1
  weight_decay: 0.0001  # 1e-4 L2 regularization from TacticAI S.Table 1
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  clip_grad_norm: 1.0
  checkpoint_dir: "checkpoints"

loss_weights:
  receiver_weight: 1.0
  target_location_weight: 1.0
  shot_weight: 1.0
  creativity_weight: 1.0
  vae_weight: 1.0
  vae_kl_weight: 0.01
